name: Backend reliability
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: Taki_Shiina_Bot/requirements-lock.txt
      - run: python -m pip install -r Taki_Shiina_Bot/requirements-lock.txt
      - run: python -m pip check
      - run: python -m pytest Taki_Shiina_Bot/tests scripts/tests -q
      - run: python scripts/check_foundation.py --facts 250
