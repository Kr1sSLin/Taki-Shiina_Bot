name: Privacy checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/privacy_check.py
      - run: python -m unittest discover -s scripts/tests -p test_privacy_check.py
      - run: python -m pip install cryptography
      - run: python -m unittest discover -s Taki_Shiina_Bot/tests -p test_secure_storage_migration.py
